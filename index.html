<script>
    let currentScene = 1;
    let isAnimating = false;
    let holdInterval = null;

    const scene8Paragraphs = [
        "Wihhh, selamat ulang tahun TUAA 😭",
        "Gak kerasa yaa kamu udah 1 tahun lebih tua dari aku, tapi gapapa, tua tua gini cantiknya ngalahin cewek Korea 😭.",
        "Gak banyak yang bisa aku beri.",
        "Cuman bisa doain aja semoga segala hal dan segala urusan dimudahkan oleh ALLAH SWT.",
        "Tetap menjadi orang baik dan jangan pernah menjadi orang jahat dan orang sok cool 🫡.",
        "Tetap sabar dalam menghadapi semua ujian yaa Zahh.",
        "Aku tahu kamu banyak banget ujiannya, tapi kamu bisa lewatin itu semuaa.",
        "Semoga kelak Allah SWT memberikan hikmah baik dari semua ujian-ujian yang telah kamu lewati.",
        "Sekali lagi...",
        "Happy Birthday, Zizah! 🤍🎂"
    ];

    /* ================= BULLETPROOF MOBILE AUDIO ENGINE ================= */
    let sfxCtx = null;
    let audioUnlocked = false;

    const bgAudio1 = document.getElementById('bg-music-1');
    const bgAudio2 = document.getElementById('bg-music-2');

    function initAudioContext() {
        if (!sfxCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) sfxCtx = new AudioContextClass();
        }
        if (sfxCtx && sfxCtx.state === 'suspended') {
            sfxCtx.resume();
        }
    }

    // Membuka blokir audio di Safari iOS & Chrome Android pada sentuhan pertama
    function unlockMobileAudio() {
        if (audioUnlocked) return;
        initAudioContext();

        // Pancing AudioContext dengan suara hening
        if (sfxCtx) {
            try {
                const buffer = sfxCtx.createBuffer(1, 1, 22050);
                const source = sfxCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(sfxCtx.destination);
                source.start(0);
            } catch(e) {}
        }

        // Putar dan siapkan audio latar
        if (bgAudio1) {
            bgAudio1.play().then(() => {
                audioUnlocked = true;
            }).catch(() => {
                // Jika URL MP3 terblokir, fallback otomatis menggunakan synth
                playSynthFallback(1);
                audioUnlocked = true;
            });
        }

        // Preload track ke-2 untuk mobile
        if (bgAudio2) {
            bgAudio2.load();
        }
    }

    function switchAudioTrack2() {
        try { bgAudio1.pause(); } catch (e) {}
        if (bgAudio2) {
            bgAudio2.play().catch(() => {
                playSynthFallback(2);
            });
        }
    }

    // Melodi cadangan jika link MP3 gagal/terputus di jaringan HP
    let synthInterval = null;
    function playSynthFallback(trackNum) {
        if (synthInterval) clearInterval(synthInterval);
        initAudioContext();
        if (!sfxCtx) return;

        const melody1 = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
        const melody2 = [261.63, 261.63, 293.66, 261.63, 349.23, 329.63, 392.00];
        const notes = trackNum === 1 ? melody1 : melody2;
        let noteIdx = 0;

        synthInterval = setInterval(() => {
            if (!sfxCtx) return;
            try {
                const osc = sfxCtx.createOscillator();
                const gain = sfxCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIdx % notes.length], sfxCtx.currentTime);
                gain.gain.setValueAtTime(0.05, sfxCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, sfxCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(sfxCtx.destination);
                osc.start();
                osc.stop(sfxCtx.currentTime + 0.4);
                noteIdx++;
            } catch(e) {}
        }, 320);
    }

    /* ================= CUTE SFX GENERATOR ================= */
    function playCutePop() {
        initAudioContext();
        if (!sfxCtx) return;
        try {
            const osc = sfxCtx.createOscillator();
            const gain = sfxCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, sfxCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(950, sfxCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.25, sfxCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(sfxCtx.destination);
            osc.start();
            osc.stop(sfxCtx.currentTime + 0.09);
        } catch(e) {}
    }

    function playFunnyBoing() {
        initAudioContext();
        if (!sfxCtx) return;
        try {
            const osc = sfxCtx.createOscillator();
            const gain = sfxCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250, sfxCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(650, sfxCtx.currentTime + 0.12);
            osc.frequency.linearRampToValueAtTime(320, sfxCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.2, sfxCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.28);
            osc.connect(gain);
            gain.connect(sfxCtx.destination);
            osc.start();
            osc.stop(sfxCtx.currentTime + 0.3);
        } catch(e) {}
    }

    function playSparkleChime() {
        initAudioContext();
        if (!sfxCtx) return;
        const notes = [659.25, 783.99, 987.77, 1318.51];
        notes.forEach((freq, i) => {
            setTimeout(() => {
                try {
                    const osc = sfxCtx.createOscillator();
                    const gain = sfxCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, sfxCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, sfxCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, sfxCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(sfxCtx.destination);
                    osc.start();
                    osc.stop(sfxCtx.currentTime + 0.31);
                } catch(e) {}
            }, i * 60);
        });
    }

    function playFlashSound() {
        initAudioContext();
        if (!sfxCtx) return;
        try {
            const osc = sfxCtx.createOscillator();
            const gain = sfxCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1000, sfxCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(350, sfxCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.18, sfxCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(sfxCtx.destination);
            osc.start();
            osc.stop(sfxCtx.currentTime + 0.07);
        } catch(e) {}
    }

    function playSoftBlip() {
        initAudioContext();
        if (!sfxCtx) return;
        try {
            const osc = sfxCtx.createOscillator();
            const gain = sfxCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520 + Math.random() * 80, sfxCtx.currentTime);
            gain.gain.setValueAtTime(0.05, sfxCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(sfxCtx.destination);
            osc.start();
            osc.stop(sfxCtx.currentTime + 0.06);
        } catch(e) {}
    }

    /* ================= SCENE SWITCHING ================= */
    function showScene(sceneNumber) {
        if (isAnimating && sceneNumber !== 1) return;
        isAnimating = true;

        const current = document.getElementById(`scene-${currentScene}`);
        const next = document.getElementById(`scene-${sceneNumber}`);

        if (current) {
            current.style.opacity = '0';
            current.style.transform = 'translateY(-15px)';
            setTimeout(() => {
                current.classList.add('hidden');
                current.classList.remove('flex');
                
                if (next) {
                    next.classList.remove('hidden');
                    next.classList.add('flex');
                    next.style.opacity = '0';
                    next.style.transform = 'translateY(15px)';

                    setTimeout(() => {
                        next.style.opacity = '1';
                        next.style.transform = 'translateY(0)';
                        currentScene = sceneNumber;
                        isAnimating = false;
                        handleSceneInit(sceneNumber);
                    }, 50);
                }
            }, 320);
        }
    }

    function handleSceneInit(sceneNum) {
        if (sceneNum === 2) {
            startTypewriterScene2();
        } else if (sceneNum === 3 || sceneNum === 4 || sceneNum === 5) {
            playFunnyBoing();
        } else if (sceneNum === 8) {
            switchAudioTrack2();
        } else if (sceneNum === 9) {
            triggerConfettiBurst();
            playSparkleChime();
        }
    }

    /* ================= SCENE 1: ENVELOPE ================= */
    const envelope = document.getElementById('envelope');
    const holdIndicator = document.getElementById('hold-indicator');
    const holdProgressBar = document.getElementById('hold-progress');
    const s1NextBtn = document.getElementById('s1-next-btn');
    let isOpenedS1 = false;

    function startHoldEnvelope(e) {
        unlockMobileAudio();
        if (isOpenedS1) return;
        holdIndicator.classList.remove('hidden');
        let progress = 0;

        holdInterval = setInterval(() => {
            progress += 5;
            holdProgressBar.style.width = `${progress}%`;

            if (progress >= 100) {
                clearInterval(holdInterval);
                triggerEnvelopeOpen();
            }
        }, 40);
    }

    function endHoldEnvelope() {
        if (isOpenedS1) return;
        clearInterval(holdInterval);
        holdProgressBar.style.width = '0%';
        holdIndicator.classList.add('hidden');
    }

    function triggerEnvelopeOpen() {
        isOpenedS1 = true;
        envelope.classList.add('open');
        holdIndicator.classList.add('hidden');
        playSparkleChime();
        
        setTimeout(() => {
            s1NextBtn.classList.remove('hidden');
            s1NextBtn.classList.add('flex');
        }, 600);
    }

    envelope.addEventListener('pointerdown', startHoldEnvelope);
    envelope.addEventListener('pointerup', endHoldEnvelope);
    envelope.addEventListener('pointerleave', endHoldEnvelope);
    s1NextBtn.addEventListener('click', () => { playCutePop(); showScene(2); });

    /* ================= SCENE 2: TYPEWRITER ================= */
    const textScene2 = "Hallo zizahh, hari ini adalah hari yang sangat spesial buat kamu🤗\n\nKarena apa?\n\nYapp, kamu dapet ucapan yang sangat spesial dari temen kamu...\n\nKira kira apa yaa??";
    const typewriterContainer = document.getElementById('typewriter-text-1');
    const s2NextBtn = document.getElementById('s2-next-btn');

    function startTypewriterScene2() {
        typewriterContainer.innerHTML = '';
        const words = textScene2.split(/(\s+)/);
        
        words.forEach(word => {
            if (word === '\n\n') {
                typewriterContainer.appendChild(document.createElement('br'));
                typewriterContainer.appendChild(document.createElement('br'));
            } else {
                const span = document.createElement('span');
                span.className = 'word-span';
                span.textContent = word;
                typewriterContainer.appendChild(span);
            }
        });

        const spans = typewriterContainer.querySelectorAll('.word-span');
        let delay = 0;

        spans.forEach((span, index) => {
            setTimeout(() => {
                span.classList.add('visible');
                playSoftBlip();
                if (index === spans.length - 1) {
                    setTimeout(() => {
                        s2NextBtn.classList.remove('hidden');
                        s2NextBtn.classList.add('block');
                    }, 300);
                }
            }, delay);
            delay += 110;
        });
    }

    s2NextBtn.addEventListener('click', () => { playCutePop(); showScene(3); });

    /* ================= SCENE 3, 4, 5 NAVIGATION ================= */
    document.getElementById('s3-next-btn').addEventListener('click', () => { playCutePop(); showScene(4); });
    document.getElementById('s4-next-btn').addEventListener('click', () => { playCutePop(); showScene(5); });
    document.getElementById('s5-next-btn').addEventListener('click', () => { playCutePop(); showScene(6); });

    /* ================= SCENE 6: GIFT BOX ================= */
    const giftBox = document.getElementById('gift-box');
    const giftLid = document.getElementById('gift-lid');
    const giftBtn = document.getElementById('s6-gift-btn');
    const childhoodPhotoCard = document.getElementById('childhood-photo-card');
    const s6Title = document.getElementById('s6-title');
    const s6NextBtn = document.getElementById('s6-next-btn');

    function openGift() {
        if (giftBox.classList.contains('opened')) return;
        giftBox.classList.add('opened');
        giftLid.style.transform = 'translateY(-60px) rotate(-15deg)';
        giftLid.style.opacity = '0';
        
        playSparkleChime();
        triggerConfettiBurst();

        setTimeout(() => {
            giftBox.classList.add('hidden');
            giftBtn.classList.add('hidden');
            childhoodPhotoCard.classList.remove('hidden');
            s6Title.textContent = "Ini siapa sih??? Kok lucu bangetttt 😭";
            s6NextBtn.classList.remove('hidden');
        }, 350);
    }

    giftBtn.addEventListener('click', openGift);
    giftBox.addEventListener('click', openGift);
    s6NextBtn.addEventListener('click', () => { playCutePop(); showScene(7); });

    /* ================= SCENE 7: GLASSES ================= */
    const imgAdult = document.getElementById('img-adult');
    const glassesOverlay = document.getElementById('glasses-overlay');
    const glassesBtn = document.getElementById('s7-glasses-btn');
    const s7Title = document.getElementById('s7-title');
    const s7Caption = document.getElementById('s7-caption');
    const s7NextBtn = document.getElementById('s7-next-btn');
    const flashEffect = document.getElementById('flash-effect');

    glassesBtn.addEventListener('click', () => {
        playFlashSound();
        flashEffect.classList.add('active');
        setTimeout(() => flashEffect.classList.remove('active'), 200);

        imgAdult.classList.remove('blur-md', 'scale-105');
        imgAdult.classList.add('blur-none', 'scale-100');
        
        glassesOverlay.style.opacity = '1';
        setTimeout(() => glassesOverlay.style.opacity = '0', 700);

        s7Title.textContent = "Nahh ini baru cutee 😭🫵";
        s7Caption.textContent = "Cakep bener temen gue! ✨";
        
        glassesBtn.classList.add('hidden');
        s7NextBtn.classList.remove('hidden');
        s7NextBtn.classList.add('inline-block');

        setTimeout(() => playSparkleChime(), 150);
        triggerSparkles();
    });

    s7NextBtn.addEventListener('click', () => { playCutePop(); showScene(8); });

    /* ================= SCENE 8: FLOWER & FLOW LETTER ================= */
    const flowerWrapper = document.getElementById('flower-wrapper');
    const flowerHoldIndicator = document.getElementById('flower-hold-indicator');
    const flowerHoldProgress = document.getElementById('flower-hold-progress');
    const flowerLetterCard = document.getElementById('flower-letter-card');
    const s8Subheading = document.getElementById('s8-subheading');
    const s8NextBtn = document.getElementById('s8-next-btn');
    let flowerOpened = false;
    let flowerHoldInterval = null;

    function startHoldFlower() {
        if (flowerOpened) return;
        initAudioContext();
        flowerHoldIndicator.classList.remove('hidden');
        let progress = 0;

        flowerHoldInterval = setInterval(() => {
            progress += 4;
            flowerHoldProgress.style.width = `${progress}%`;

            if (progress >= 100) {
                clearInterval(flowerHoldInterval);
                triggerFlowerBloom();
            }
        }, 35);
    }

    function endHoldFlower() {
        if (flowerOpened) return;
        clearInterval(flowerHoldInterval);
        flowerHoldProgress.style.width = '0%';
        flowerHoldIndicator.classList.add('hidden');
    }

    function triggerFlowerBloom() {
        flowerOpened = true;
        flowerHoldIndicator.classList.add('hidden');
        flowerWrapper.classList.add('bloomed');
        
        playSparkleChime();
        triggerSparkles();

        setTimeout(() => {
            flowerWrapper.style.transform = 'scale(0.85)';
            s8Subheading.textContent = "🌷 Surat spesial telah terbuka untukmu ✨";
            flowerLetterCard.classList.remove('hidden');
            flowerLetterCard.classList.add('block', 'animate-pop-in');
            revealFlowerLetterParagraphs();
        }, 600);
    }

    flowerWrapper.addEventListener('pointerdown', startHoldFlower);
    flowerWrapper.addEventListener('pointerup', endHoldFlower);
    flowerWrapper.addEventListener('pointerleave', endHoldFlower);

    function revealFlowerLetterParagraphs() {
        const letterContent = document.getElementById('flower-letter-content');
        letterContent.innerHTML = '';
        let delay = 0;

        scene8Paragraphs.forEach((paragraphText, idx) => {
            const p = document.createElement('p');
            p.className = 'opacity-0 transition-all duration-500 transform translate-y-3 leading-relaxed';
            p.textContent = paragraphText;

            if (idx === 0) {
                p.className += ' font-bold text-sm sm:text-base text-burgundy font-aesthetic tracking-wide bg-pink-100/80 p-3 rounded-xl border border-pink-200 shadow-sm';
            } else if (idx === scene8Paragraphs.length - 1) {
                p.className += ' font-bold text-base sm:text-lg text-burgundy pt-3 border-t border-pink-200/80 font-script text-center text-sweet-pink mt-2';
            } else {
                p.className += ' font-handwritten text-base sm:text-lg text-burgundy/90 tracking-wide';
            }

            letterContent.appendChild(p);

            setTimeout(() => {
                p.classList.remove('opacity-0', 'translate-y-3');
                p.classList.add('opacity-100', 'translate-y-0');
                playSoftBlip();

                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });

                if (idx === scene8Paragraphs.length - 1) {
                    setTimeout(() => {
                        s8NextBtn.classList.remove('hidden');
                        s8NextBtn.classList.add('inline-block');
                        playSparkleChime();
                        window.scrollTo({
                            top: document.body.scrollHeight,
                            behavior: 'smooth'
                        });
                    }, 400);
                }
            }, delay);

            delay += 700;
        });
    }

    s8NextBtn.addEventListener('click', () => { playCutePop(); showScene(9); });

    /* ================= SCENE 9: LIGHTBOX ================= */
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');

    function openLightbox(src, caption) {
        playCutePop();
        lightboxImg.src = src;
        lightboxCaption.textContent = caption;
        lightbox.classList.remove('hidden');
        lightbox.classList.add('flex');
    }

    function closeLightbox() {
        playCutePop();
        lightbox.classList.add('hidden');
        lightbox.classList.remove('flex');
    }

    function restartSurprise() {
        playCutePop();
        location.reload();
    }

    /* ================= BACKGROUND PARTICLES ================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBgCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBgCanvas);
    resizeBgCanvas();

    class HeartParticle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * bgCanvas.width;
            this.y = bgCanvas.height + 20;
            this.size = Math.random() * 12 + 8;
            this.speedY = Math.random() * 1.2 + 0.4;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.angle = Math.random() * 360;
            this.angularSpeed = (Math.random() - 0.5) * 1.5;
        }
        update() {
            this.y -= this.speedY;
            this.angle += this.angularSpeed;
            if (this.y < -30) this.reset();
        }
        draw() {
            bgCtx.save();
            bgCtx.translate(this.x, this.y);
            bgCtx.rotate((this.angle * Math.PI) / 180);
            bgCtx.globalAlpha = this.opacity;
            bgCtx.fillStyle = '#F472B6';
            bgCtx.font = `${this.size}px sans-serif`;
            bgCtx.fillText('🤍', 0, 0);
            bgCtx.restore();
        }
    }

    for (let i = 0; i < 18; i++) {
        particles.push(new HeartParticle());
    }

    function animateBgParticles() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateBgParticles);
    }
    animateBgParticles();

    /* ================= CONFETTI ================= */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiPieces = [];

    function resizeConfettiCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);
    resizeConfettiCanvas();

    function triggerConfettiBurst() {
        const colors = ['#F472B6', '#881337', '#FAD1DC', '#FEF08A', '#38BDF8'];
        for (let i = 0; i < 70; i++) {
            confettiPieces.push({
                x: confettiCanvas.width / 2,
                y: confettiCanvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.7) * 14,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 7 + 4,
                life: 100
            });
        }
    }

    function triggerSparkles() {
        triggerConfettiBurst();
    }

    function animateConfetti() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiPieces.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life -= 1.5;

            confettiCtx.fillStyle = p.color;
            confettiCtx.beginPath();
            confettiCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            confettiCtx.fill();

            if (p.life <= 0) confettiPieces.splice(idx, 1);
        });
        requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    // Global First Touch Listener
    ['touchstart', 'pointerdown', 'click'].forEach(evt => {
        document.addEventListener(evt, unlockMobileAudio, { once: true });
    });
</script>
